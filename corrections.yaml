# Human judgements about this document's text, applied deterministically as a
# final pipeline pass, so re-running reproduces the same output.
#
# A correction describes the text; a pass describes how to read the source.
# If you are writing one to undo something the parser did, you needed a pass
# or a bug fix instead — see scripts/ingest/README.md.
#
# Every correction must match exactly once. Zero matches, or more than one,
# fails the build naming the id: a stale correction is a loud error rather
# than rotting quietly into a lie about what was reviewed.
#
#   - id: c-0001
#     where: { volume: 1, printed: 380 }   # optional; narrows to one page
#     find: "So Help 1;fe Godp. 451"
#     replace: "So Help Me God p. 451"
#     reason: small-font OCR; checked against the scan
#     added: 2026-08-28
version: 1
corrections:
  # The OCR of '"hostages,"' is garbled, and the page's layout cut the sentence
  # into a paragraph, a quotation and the paragraph after it. A `find` with a
  # blank line spans the blocks and joins them (reportsthatmatter-2dw). Needs
  # the @rtm/ingest release that carries spanning corrections. (The footnote
  # marker is still a bare number with a space before it at this stage; it is
  # linked later in the pipeline.) Since layoutMarkers links the markers from the
  # layout, which has no raised "136" in the garble, the reference is written
  # out (reportsthatmatter-4kfr).
  - id: c-0001
    where: { volume: 1, printed: 32 }
    find: "\"hostaoes\n\n> b ' \" 136 reminisced about\n\nJanuary 6"
    replace: "\"hostages,\"[^136] reminisced about January 6"
    reason: OCR garble of "hostages," split the sentence into a paragraph and a quotation; checked against the scan (PDF p.40, printed p.32)
    added: 2026-10-02

  # Superscript markers the OCR misread: note 50 as "5°" (printed p.14) and
  # note 55 fused to the dash after it, "certification⁵⁵—a fact" read as
  # "55-a" (printed p.15). Rewritten (note 50 to its explicit reference, since
  # layoutMarkers sees no raised "50" in "5°"; note 55's dash restored after the
  # reference layoutMarkers makes), so the notes attach to their text rather than showing
  # only under "Notes not linked in the text" (reportsthatmatter-4yp, -4kfr).
  - id: c-0002
    find: "targeted states. 5° For example"
    replace: "targeted states.[^50] For example"
    reason: superscript note 50 OCR'd as "5°"; checked against the scan (PDF p.22, printed p.14)
    added: 2026-10-02
  - id: c-0003
    find: "congressional certification[^55]-a fact"
    replace: "congressional certification[^55]—a fact"
    reason: superscript note 55 followed by an em dash, OCR'd as "55-a" (layoutMarkers links the 55; the dash stays a hyphen); checked against the scan (PDF p.23, printed p.15)
    added: 2026-10-02
  # The caption's marker is set raised but the OCR layer gives it at the
  # caption's size, so layoutMarkers does not see it; the text linker it
  # replaced did (reportsthatmatter-4kfr).
  - id: c-0004
    where: { volume: 1, printed: 27 }
    find: "LightRocket/Getty Images) 115"
    replace: "LightRocket/Getty Images)[^115]"
    reason: superscript note 115 after the caption, not raised in the OCR layer; checked against the scan (PDF p.35, printed p.27)
    added: 2026-10-04
  # Superscript markers whose last digit the OCR dropped (reportsthatmatter-4kfr):
  # read from the text they were linked to the wrong note (70 as 7, 140 as 14)
  # or not at all; layoutMarkers leaves them bare.
  - id: c-0005
    find: "their electoral votes. 7 Co-Conspirator 4"
    replace: "their electoral votes.[^70] Co-Conspirator 4"
    reason: superscript note 70 OCR'd as "7"; checked against the scan (PDF p.26, printed p.18)
    added: 2026-10-04
  - id: c-0006
    find: "his own running mate. 14 For example"
    replace: "his own running mate.[^140] For example"
    reason: superscript note 140 OCR'd as "14"; checked against the scan (PDF p.44, printed p.36)
    added: 2026-10-04
  - id: c-0007
    find: "to these officials followed. 20 ° For instance"
    replace: "to these officials followed.[^200] For instance"
    reason: superscript note 200 OCR'd as "20 °"; checked against the scan (PDF p.84, printed p.76)
    added: 2026-10-04
  # Note markers set on headings, which the heading cleanup took off with the heading's number, so the notes were
  # defined but never referenced (reportsthatmatter-pq0, -npg3 (E)).
  - id: c-0008
    where: { volume: 1, printed: 2 }
    find: "THE RESULTS OF THE INVESTIGATION"
    replace: "THE RESULTS OF THE INVESTIGATION[^1]"
    reason: superscript note 1 on the heading "I. THE RESULTS OF THE INVESTIGATION"; checked against the scan (PDF p.10, printed p.2)
    added: 2026-11-12
  - id: c-0009
    where: { volume: 1, printed: 92 }
    find: "The Investigative Process"
    replace: "The Investigative Process[^248]"
    reason: superscript note 248 on the heading "A. The Investigative Process"; checked against the scan (printed p.92)
    added: 2026-11-12
  # The appendix's tables (PDF pp.146-154; the rows are written by the appendixFilings pass): OCR misreadings in the
  # section titles and number cells, and a note marker on a section title (reportsthatmatter-05c, -npg3 (F)).
  - id: c-0010
    where: { volume: 1, printed: 143 }
    find: "(PARTIALLY UNSEALEDJ"
    replace: "(PARTIALLY UNSEALED)[^274]"
    reason: 'the OCR read "UNSEALED)" as "UNSEALEDJ", and dropped superscript note 274 on the title; checked against the scan (PDF p.151, printed p.143)'
    added: 2026-11-12
  - id: c-0011
    find: "PRESIDENTIAL IMlvfUNITY APPELLATE LITIGATION"
    replace: "PRESIDENTIAL IMMUNITY APPELLATE LITIGATION"
    reason: OCR of "MM"; checked against the scan (PDF p.149, printed p.141)
    added: 2026-11-12
  - id: c-0012
    find: "ECF No. 2.),.,,.,.), 9/5/2024"
    replace: "ECF No. 233, 9/5/2024"
    reason: OCR garble of the number cell "233"; checked against the scan (PDF p.148, printed p.140)
    added: 2026-11-12
  - id: c-0013
    find: "ECF No. 61, 9/2712023"
    replace: "ECF No. 61, 9/27/2023"
    reason: OCR dropped the slash in the date "9/27/2023"; checked against the scan (PDF p.146, printed p.138)
    added: 2026-11-12
  # The Blanche letter's note 1, its marker after a stray space before the full stop (reportsthatmatter-npg3 (G)).
  - id: c-0014
    find: "(the \"Draft Report\") . 1"
    replace: "(the \"Draft Report\").[^1]"
    reason: superscript note 1 of the appended letter, read as a bare number; checked against the scan (PDF p.159, letter p.1)
    added: 2026-11-12
  # OCR word error the golden page records (reportsthatmatter-n0l).
  - id: c-0015
    find: "elector nommees information"
    replace: "elector nominees information"
    reason: OCR read "nominees" as "nommees"; checked against the scan (PDF p.21, printed p.13)
    added: 2026-11-12
