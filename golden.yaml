# Golden pages: ground truth for this report, read off the PDF page image and checked by `pnpm ingest verify`.
# Format and rules: @rtm/ingest src/golden.ts and the site's docs/quality-harness.md ("Golden pages").
# A page marked xfail is a known pipeline defect: it stays red here, verify stays green, and the bead says why.
pages:
  # First page of "The Results of the Investigation": a footnote marker on the heading, five lines carried over from page 9,
  # and a paragraph that runs on to the next page.
  - pdf: 10
    printed: 2
    verified_by: "Claude (Sonnet 5.5), 2026-10-02, against the page image"
    features: [I, G, B]
    xfail: reportsthatmatter-pq0
    xfail_only: [markers]
    continues_previous: true
    opens_with: "defenses that the Office expected Mr. Trump to raise at trial"
    blocks:
      - heading: "I. THE RESULTS OF THE INVESTIGATION"
      - paragraph: {start: "In 2020, then-President Donald J. Trump ran for reelection", end: "in furtherance of his scheme.", notes: [2, 3]}
      - paragraph: {start: "As set forth in the original and superseding indictments", continues: true}
    footnotes: [1, 2, 3]
    markers: [1, 2, 3]
  # A paragraph whose last word is on the next page, where the footnotes' run-over text sits between the halves (class E, g1f).
  - pdf: 21
    printed: 13
    verified_by: "Claude (Sonnet 5.5), 2026-10-02, against the page image"
    features: [E, B, M]
    xfail: reportsthatmatter-n0l
    xfail_only: [must_contain]
    continues_previous: true
    opens_with: "sent directions to the Trump electors in each targeted state"
